name: Bug report
description: Something in the app does not work as it should
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Free Print version
      description: Shown on About
    validations: { required: true }
  - type: input
    id: device
    attributes:
      label: Phone, Android version and printer
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: "Optional. `adb logcat FreePrintNative:I AndroidRuntime:E '*:S'` is the useful filter."
      render: text
